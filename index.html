<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KaM: Война и Мир — Браузерная стратегия</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="ui-overlay">
            <div id="top-bar">
                <div class="resource" id="res-gold"><span class="icon">🪙</span><span class="value">0</span></div>
                <div class="resource" id="res-wood"><span class="icon">🪵</span><span class="value">0</span></div>
                <div class="resource" id="res-stone"><span class="icon">🪨</span><span class="value">0</span></div>
                <div class="resource" id="res-food"><span class="icon">🍖</span><span class="value">0</span></div>
                <div class="resource" id="res-pop"><span class="icon">👥</span><span class="value">0/0</span></div>
            </div>
            <div id="bottom-bar">
                <div id="build-menu"></div>
                <div id="selection-info"></div>
            </div>
            <div id="minimap-container">
                <canvas id="minimap"></canvas>
            </div>
            <div id="game-message"></div>
        </div>
    </div>
    <script src="js/utils.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/render.js"></script>
    <script src="js/game.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
